dependencies = [
    'Authlib==1.6.0',
    'email_validator==2.2.0',
    # 'Flask==3.1.1',
    'itsdangerous==2.2.0',
    'jwt==1.3.1',
    # 'pytest==8.4.0',
    # 'python-dotenv==1.1.0',
    'typeguard==4.4.2',
    'zxcvbn==4.5.0',
]

[tool.setuptools]
