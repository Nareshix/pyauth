[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyauth"
version = "0.0.1" # this is for Pypi
description = "auth"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["python", "python3",]
authors = [
    { name = "Naresh", email = "nareshix66@gmail.com" }
]
maintainers = [
  {name = "Naresh", email = "nareshix66@gmail.com"}
]

